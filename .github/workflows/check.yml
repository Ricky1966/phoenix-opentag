name: Firmware checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host parser and delivery tests
        run: bash tests/run_host.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Compile ESP32 with placeholder credentials
        run: |
          cp src/secrets.h.example src/secrets.h
          pio run -e esp32dev
      - name: Compile ESP32 with HTTP transport enabled
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/secrets.h')
          p.write_text(p.read_text() + '\n#define PHOENIX_TAG_ENDPOINT "http://127.0.0.1:9999/tag"\n')
          PY
          pio run -e esp32dev
