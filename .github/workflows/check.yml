name: Firmware checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host parser and delivery tests
        run: bash tests/run_host.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Compile ESP32 with placeholder credentials
        run: |
          cp src/secrets.h.example src/secrets.h
          pio run -e esp32dev
