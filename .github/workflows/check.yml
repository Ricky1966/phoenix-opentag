name: Firmware checks
on:
  push:
    branches: [main, 'codex/**', 'claude/**']
  pull_request:
permissions:
  contents: read
jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Bridge regression tests on CB1 Python version
        run: python -m unittest discover -s tests -p 'test_daemon.py'
  check:
    runs-on: ubuntu-latest
    env:
      PHOENIX_OTA_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Host parser and delivery tests
        run: bash tests/run_host.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Compile ESP32 without OTA
        run: |
          cp src/secrets.h.example src/secrets.h
          sed -i '/^#define OTA_PASSWORD/d' src/secrets.h
          pio run -e esp32dev
      - name: Compile ESP32 with OTA and USB/WiFi transport
        run: |
          cp src/secrets.h.example src/secrets.h
          pio run -e esp32dev_ota
