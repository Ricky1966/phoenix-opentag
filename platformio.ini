; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_ignore =
  PN5180 Library
	atrappmann/PN5180 Library@^1.5

; Aggiornamento via WiFi (OTA), senza staccare l'ESP32 da Phoenix. Il primo
; firmware con OTA va flashato via USB. Uso:
;   PHOENIX_OTA_PASSWORD='...' pio run -e esp32dev_ota -t upload
; Se phoenix-opentag.local non si risolve: --upload-port <IP dell'ESP32>
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = phoenix-opentag.local
upload_flags =
  --auth=${sysenv.PHOENIX_OTA_PASSWORD}
